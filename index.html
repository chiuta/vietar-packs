   «Nemarcată toxică» nu primește niciodată culoarea verde: nu trebuie să semene cu un semn de siguranță. */
#app [hidden],.vp-box [hidden]{display:none!important}
.vp-msg{min-height:1.5em;max-width:80ch;font-weight:650;margin:.5em 0}
.vp-msg p{margin:.2em 0}
.vp-lines{margin:.3em 0 .3em 1.2em;padding:0;max-width:80ch;overflow-wrap:anywhere}
.vp-main{position:relative}
.vp-safe{border:2px solid #b3261e;border-radius:10px;background:var(--bg2);padding:6px 16px 8px;margin:10px 0;max-width:60rem}
.vp-safe h3{margin:.5em 0 .3em}
.vp-safe p{margin:.4em 0;max-width:80ch;overflow-wrap:anywhere}
.vp-strong{font-weight:700}
.vp-tabs{display:flex;flex-wrap:wrap;margin:10px 0 6px}
.vp-tabs .btn{margin:0 8px 8px 0;min-height:44px}
.vp-box{position:relative;margin:8px 0;min-width:0}
.vp-box h3{margin:1.1em 0 .4em}
.vp-box h4{margin:1.2em 0 .4em}
.vp-box h5,.vp-maph{margin:1em 0 .4em;font-size:1rem}
.vp-bar{display:flex;flex-wrap:wrap;align-items:flex-start;margin:10px 0}
.vp-bar>*{margin:0 10px 8px 0;min-width:0;max-width:100%}
.vp-bar .btn{min-height:44px}
.vp-f{display:flex;flex-direction:column;font-size:.88rem;color:var(--mut);min-width:0;max-width:100%;margin:0 12px 10px 0}
.vp-f>label{display:flex;align-items:flex-end;min-height:2.7em;font-weight:650;line-height:1.25;margin-bottom:4px}
.vp-fh{font-size:.82rem;margin-top:4px;max-width:34rem}
.vp-f-wide{flex:1 1 18rem}
.vp-f-short{width:11rem;flex:0 0 auto}
.vp-inp{background:var(--card);color:var(--tx);border:1px solid var(--line);border-radius:10px;font:inherit;font-size:1rem;min-height:44px;padding:6px 10px;max-width:100%;min-width:0;box-sizing:border-box}
.vp-inp:hover{border-color:var(--ac)}
.sel.vp-inp{max-width:100%}
textarea.vp-inp{display:block;width:100%;max-width:80ch;line-height:1.45;resize:vertical}
textarea.vp-mono{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.92rem}
input.vp-inp[type="text"],input.vp-inp[type="search"]{width:100%;max-width:24rem}
.vp-f-short input.vp-inp{max-width:100%}
input[type="file"].vp-inp{padding:8px 10px;max-width:100%}
.vp-hint{color:var(--mut);font-size:.92rem;max-width:80ch;margin:.4em 0}
.vp-count{max-width:80ch;margin:.8em 0;font-weight:650}
.vp-meta{color:var(--mut);font-size:.9rem;margin:.2em 0;max-width:80ch;overflow-wrap:anywhere}
.vp-box [tabindex="-1"]:focus{outline:3px solid var(--ac);outline-offset:2px}
.vp-tblwrap:focus,.vp-code:focus{outline:3px solid var(--ac);outline-offset:2px}
.vp-lat{font-style:italic;color:var(--mut)}
.vp-lc{color:var(--mut);font-size:.85em}
.vp-g{color:var(--mut);font-size:.85rem}
.vp-pre{white-space:pre-wrap;overflow-wrap:anywhere}
.vp-badge{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:0 8px;font-size:.8rem;font-weight:650;color:var(--tx);background:var(--bg2);margin:0 .3em}
.vp-badge-tox{background:#b3261e;border-color:#b3261e;color:#fff}
.vp-badge-st{border-style:dashed}

/* lista de specii și fișa unei specii */
.vp-listbox{max-width:60rem}
.vp-list{list-style:none;margin:0;padding:0}
.vp-list li{margin:0}
.vp-sp{display:block;width:100%;max-width:46rem;text-align:left;white-space:normal;margin:6px 0;min-height:48px;padding:8px 14px;overflow-wrap:anywhere}
.vp-n{font-weight:700}
.vp-more{min-height:44px;margin:8px 0}
.vp-detail{max-width:60rem}
.vp-detail>.btn{min-height:44px;margin:6px 0}
.vp-d-h{margin:.6em 0 .2em}
.vp-tox{border:1px solid var(--line);border-left:6px dashed var(--mut);border-radius:10px;padding:4px 14px 8px;margin:10px 0;max-width:46rem;background:var(--card)}
.vp-tox-yes{border-color:#b3261e;border-left:6px solid #b3261e}
.vp-tox-h{font-weight:750;font-size:1.1rem;margin:.5em 0 .2em}
.vp-tox h4{margin:.8em 0 .3em}
.vp-names{list-style:none;margin:.3em 0;padding:0}
.vp-names li{margin:.2em 0}
.vp-looks{list-style:none;margin:.3em 0;padding:0;max-width:60rem}
.vp-looks li{margin:8px 0;padding:6px 10px;border:1px solid var(--line);border-left:4px solid #b3261e;border-radius:10px;background:var(--card)}
.vp-lk{min-height:44px;margin:0 8px 4px 0}
.vp-fig{margin:10px 0;max-width:28rem}
.vp-photo{display:block;width:auto;max-width:100%;height:auto;border-radius:8px;background:#fff}
.vp-cap{font-size:.88rem;color:var(--mut);margin-top:4px;overflow-wrap:anywhere}
.vp-audio{margin:.3em 0 .3em 1.2em;padding:0;max-width:80ch;overflow-wrap:anywhere}
.vp-audio li{margin:.4em 0}

/* tabele și pachete */
.vp-tblwrap{overflow-x:auto;max-width:100%;margin:6px 0}
.vp-tbl{border-collapse:collapse;min-width:16rem}
.vp-tbl th,.vp-tbl td{border:1px solid var(--line);padding:.35em .7em;text-align:right;font-weight:400}
.vp-tbl thead th{background:var(--bg2);font-weight:650}
.vp-tbl thead th:first-child,.vp-tbl tbody th{text-align:left}
.vp-tbl tbody th{font-weight:650}
.vp-pack{margin:14px 0;padding:10px 14px;border:1px solid var(--line);border-left:4px solid var(--ac);border-radius:10px;background:var(--card);max-width:60rem;overflow-wrap:anywhere}
.vp-pk-h{margin-top:.2em}
.vp-status{margin:.5em 0;max-width:80ch}
.vp-imp{margin:22px 0 8px;max-width:60rem}
.vp-rep{margin:10px 0;max-width:80ch;min-height:1.5em}
.vp-bad{color:#ffb4ab}
:root[data-theme="light"] .vp-bad{color:#8c1d18}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]) .vp-bad{color:#8c1d18}}
.vp-ok{color:#9be3a8;font-weight:650}
:root[data-theme="light"] .vp-ok{color:#14591f}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]) .vp-ok{color:#14591f}}

/* creatorul */
.vp-form,.vp-meta-box,.vp-look,.vp-json,.vp-check,.vp-dlist{max-width:60rem}
.vp-dl,.vp-pairs{list-style:none;margin:6px 0;padding:0}
.vp-dl-row,.vp-pair{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;border:1px solid var(--line);border-radius:10px;padding:6px 10px;margin:6px 0;background:var(--card)}
.vp-dl-i,.vp-pair-t{flex:1 1 16rem;min-width:0;overflow-wrap:anywhere}
.vp-dl-b{flex:0 0 auto}
.vp-dl-b .btn,.vp-pair .btn{min-height:44px;margin:4px 0 4px 8px}
.vp-chk{margin:8px 0;max-width:80ch}
.vp-steps{margin:.4em 0 .6em 1.4em;padding:0;max-width:80ch}
.vp-steps li{margin:.5em 0}
.vp-code{background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;overflow:auto;max-width:60rem;font-size:.88rem;line-height:1.4}
.vp-list-lim{max-width:80ch}
.btn[aria-disabled="true"]{opacity:.6;cursor:not-allowed}
@media (max-width:860px){.vp-inp{min-width:80px}.vp-f-short{width:7rem}}
</style>

 licence and source. Sounds are links to xeno-canto.org only.","h_limits":"Honest limits","lim_1":"The built-in packs are drafts: names and notes were written with an AI assistant from general knowledge and checked only in part against public pages. No biologist, mycologist or native speaker has reviewed them. The Bulgarian and Moldovan packs are skeletons of 10 species each.","lim_2":"«Not marked toxic» means only that nobody marked the species as toxic in this pack. It is never a statement that a plant or mushroom is edible or safe, and the packs do not teach how to tell look-alikes apart. Never eat a wild plant or mushroom because of this page.","lim_3":"The built-in packs contain no photos and no sound links, because licences and recording numbers could not be verified offline. The format supports both, with author, licence and source.","lim_4":"Packs imported here are stored in this browser only; clearing site data removes them. Download the ones you care about.","lim_5":"The VietAR app cannot import these packs yet. For now the packs are read and checked on this page and by the scripts in the repository.","lim_6":"The interface translations were written by a machine and have not been reviewed by native speakers. Species names and notes appear in the language of the pack, with English as the fallback."},"ro":{"nav":"Pachete de specii","title":"VietAR Packs · pachete regionale de specii","open":"Deschide pachetele","tabs_l":"Secțiuni","tab_browse":"Răsfoire","tab_packs":"Pachete","tab_build":"Creare","tab_guide":"Ghid","s_h":"Citește mai întâi","s_1":"Pagina aceasta enumeră specii. Nu identifică nimic și nu este un ghid de teren.","s_2":"«Nemarcată ca toxică» nu este o promisiune de siguranță: multe plante și ciuperci cu aspect nevinovat au sosii mortale. Nu mânca și nu atinge niciodată o plantă sau o ciupercă din natură pe baza unei aplicații, a unei fotografii sau a acestei liste.","s_3":"Pachetele marcate «Ciornă» sau «Schelet» nu au fost verificate de un specialist. Întreabă un specialist local înainte să te bazezi pe ceva de aici.","b_h":"Răsfoiește un pachet","b_intro":"Caută animalele, plantele și ciupercile unei regiuni, cu nume în mai multe limbi, marcajul de toxicitate și speciile cu care sunt adesea confundate.","b_pack":"Pachet","b_search":"Căutare","b_search_hint":"Scrie un nume în orice limbă sau denumirea latină. Majusculele și diacriticele nu contează.","b_group":"Grup","b_all_groups":"Toate grupurile","b_toxic":"Marcaj de toxicitate","b_tox_all":"Toate speciile","b_tox_yes":"Marcate toxice","b_tox_no":"Nemarcate toxice","b_count":"{0} din {1} specii","b_none":"Nicio specie nu se potrivește. Șterge căutarea sau alege alt grup.","b_more":"Arată încă {0}","b_back":"Înapoi la listă","b_nopack":"Niciun pachet nu e încărcat. Importă unul în «Pachete».","b_list_l":"Specii","k_animalia":"Animale","k_plantae":"Plante","k_fungi":"Ciuperci","g_mammal":"Mamifere","g_bird":"Păsări","g_reptile":"Reptile","g_amphibian":"Amfibieni","g_fish":"Pești","g_invertebrate":"Nevertebrate","g_tree":"Arbori","g_shrub":"Arbuști","g_herb":"Ierburi și flori","g_fungus":"Ciuperci","g_other":"Altele","d_group":"{0} · {1}","d_names_h":"Nume","d_tox_yes":"Marcată toxică","d_tox_no":"Nemarcată toxică","d_tox_unk":"Fără marcaj de toxicitate","d_tox_warn":"«Nemarcată toxică» nu înseamnă că e sigur s-o mănânci sau s-o atingi. Nu te baza pe asta.","d_tox_note_h":"Notă despre toxicitate","d_notes_h":"Note","d_source":"Sursă: {0}","d_look_h":"Adesea confundată cu","d_look_help":"Unele sosii sunt mortale. Lista le numește; nu te învață cum să le deosebești.","d_look_go":"Mergi la {0}","d_photos_h":"Fotografii","d_photo_cap":"Fotografie: {0} · {1}","d_original":"Pagina originală","d_audio_h":"Sunete","d_audio_cap":"Înregistrare de {0} · {1}","d_audio_open":"Ascultă pe xeno-canto.org (se deschide alt site)","d_audio_note":"Pagina nu redă sunet; fiecare legătură deschide xeno-canto într-o filă nouă.","p_h":"Pachete","p_intro":"Un pachet este un fișie n":"Regiunea (codul țării)","c_region_hint":"Două litere mari, de exemplu RO.","c_version":"Versiunea","c_licence":"Licența pachetului","c_status":"Stare","c_authors":"Autori (separați prin virgulă)","c_sp_h":"Adaugă sau modifică o specie","c_latin":"Denumirea latină (gen și specie)","c_latin_hint":"Id-ul se face din ea: Lynx lynx devine lynx-lynx.","c_kingdom":"Regn","c_group":"Grup","c_name_en":"Numele în engleză","c_name_ro":"Numele în română","c_name_hu":"Numele în maghiară","c_name_de":"Numele în germană","c_name_x":"Altă limbă (cod)","c_name_xn":"Numele în acea limbă","c_toxic":"Toxică?","c_tox_unk":"Nespecificat (doar la animale)","c_tox_yes":"Da: toxică sau otrăvitoare","c_tox_no":"Nu: nemarcată toxică","c_note_lang":"Limba notelor de mai jos","c_tox_note":"Notă despre toxicitate (obligatorie dacă e toxică)","c_notes":"Note (opțional)","c_source":"Sursă (opțional)","c_add":"Adaugă specia","c_update":"Actualizează specia","c_cancel":"Renunță la modificare","c_added":"Am adăugat {0}.","c_updated":"Am actualizat {0}.","c_exists":"O specie cu această denumire latină e deja în ciornă. Modific-o din listă.","c_full":"Ciorna poate avea cel mult {0} specii.","c_form_err":"Corectează problemele și încearcă din nou:","c_list_h":"Specii în ciornă ({0})","c_list_none":"Nu e nicio specie încă.","c_edit":"Modifică","c_remove":"Șterge","c_remove_sure":"Ștergi?","c_removed":"Am șters {0}; au dispărut și legăturile de sosie către ea.","c_look_h":"Sosii","c_look_help":"Leagă două specii pe care oamenii le confundă. Legătura se salvează la amândouă, cu aceeași notă, fiindcă formatul pachetului o cere.","c_look_a":"Specia","c_look_b":"Adesea confundată cu","c_look_note":"Notă de avertizare (în limba notelor)","c_look_add":"Leagă-le","c_look_done":"Am legat {0} și {1}.","c_look_pairs_h":"Perechi legate","c_look_none":"Nu e nicio pereche încă.","c_look_unlink":"Desparte {0} și {1}","c_look_self":"Alege două specii diferite.","c_look_full":"O specie poate avea cel mult 8 sosii.","c_look_need_note":"Scrie mai întâi nota de avertizare.","c_look_need_two":"Ai nevoie de cel puțin două specii.","c_json_h":"Această specie ca JSON (pentru fotografii și sunete)","c_json_help":"Formularul nu are câmpuri pentru fotografii și sunete. Modifică JSON-ul ca să le adaugi (vezi Ghidul), apoi aplică. Textul e verificat ca la import.","c_json_apply":"Aplică JSON-ul","c_json_ok":"Am aplicat {0}.","c_json_err":"JSON-ul acesta nu poate fi aplicat:","c_json_bad":"Acesta nu este JSON valid.","c_check_h":"Verificare și descărcare","c_problems":"Probleme găsite: {0}","c_ok":"Pachetul trece toate verificările ({0} specii).","c_empty":"Adaugă mai întâi cel puțin o specie.","c_download":"Descarcă pachetul","c_use":"Adaugă la pachetele mele de aici","c_used":"Am adăugat «{0}» la Pachete.","c_need_fix":"Corectează mai întâi problemele.","c_clear":"Golește ciorna","c_clear_sure":"Ștergi toată ciorna?","c_cleared":"Ciorna e goală.","gd_h":"Ghid","gd_1":"Alege un pachet în «Răsfoire», caută după nume sau filtrează după grup și deschide o specie ca să-i citești numele, marcajul de toxicitate, notele și sosiile.","gd_2":"Folosește «Pachete» ca să descarci un pachet, să imporți unul primit de la cineva sau să ștergi unul. Totul rămâne în acest browser.","gd_3":"Folosește «Creare» ca să faci un pachet pentru o clasă, un club de natură sau o regiune: adaugi specii, legi sosiile, verifici pachetul și descarci fișierul.","gd_4":"Ca să împarți un pachet cu toată lumea, trimite fișierul proiectului. Contribuitorii îl împart într-un fișier pe specie, rulează verificările și îl adaugă la pachetele încorporate.","gd_5":"Un pachet este un fișier JSON cu formatul «vietar-pack» și o listă de specii. O specie poate avea fotografii (URI de date, cu autor și licență) și legături către înregistrări xeno-canto. Pagina nu încarcă nimic din rețea.","gd_ex_h":"O fotografie și un sunet la o specie","gd_ex_note":"Fotografiile trebuie să fie mici (folosește scripts/optimize.py din depozit) și să aibă autor, licență și sursă. Sunetele sunt doar legături către xeno-canto.org.","h_limits":"Limite sincere","lim_1":"Pachetele încorporate sunt ciorne: numele și notele au fost scrise cu un asistent IA din cunoștințe generale și verificate doar în parte pe pagini publice. Niciun biolog, micolog sau vorbitor nativ nu le-a revizuit. Pachetele pentru Bulgaria și Moldova sunt schelete de câte 10 specii.","lim_2":"«Nemarcată ca toxică» înseamnă doar că nimeni n-a marcat specia ca toxică în acest pachet. Nu este niciodată o afirmație că o plantă sau o ciupercă e comestibilă sau sigură, iar pachetele nu te învață cum să deosebești sosiile. Nu mânca niciodată o plantă sau o ciupercă din natură pe baza acestei pagini.","lim_3":"Pachetele încorporate nu conțin fotografii și nici legături către sunete, fiindcă licențele și numerele înregistrărilor nu au putut fi verificate fără internet. Formatul le acceptă pe amândouă, cu autor, licență și sursă.","lim_4":"Pachetele importate aici sunt păstrate doar în acest browser; ștergerea datelor site-ului le elimină. Descarcă-le pe cele la care ții.","lim_5":"Aplicația VietAR nu poate importa încă aceste pachete. Deocamdată pachetele sunt citite și verificate în această pagină și de scripturile din depozit.","lim_6":"Traducerile interfeței au fost scrise de o mașină și nu au fost revizuite de vorbitori nativi. Numele și notele speciilor apar în limba pachetului, cu engleza ca variantă de rezervă."},"fr":{"nav":"Paquets d’espèces","title":"VietAR Packs · paquets régionaux d’espèces","open":"Ouvrir les paquets","tabs_l":"Sections","tab_browse":"Parcourir","tab_packs":"Paquets","tab_build":"Créer","tab_guide":"Guide","s_h":"À lire d’abord","s_1":"Cette page dresse une liste d’espèces. Elle n’identifie rien et ce n’est pas un guide de terrain.","s_2":"« Non signalée toxique » n’est pas une promesse de sécurité : beaucoup de plantes et de champignons d’apparence inoffensive ont des sosies mortels. Ne mangez ni ne touchez jamais une plante ou un champignon sauvage à cause d’une application, d’une photo ou de cette liste.","s_3":"Les paquets marqués « Brouillon » ou « Squelette » n’ont pas été relus par un expert. Demandez conseil à un expert local avant de vous fier à quoi que ce soit ici.","b_h":"Parcourir un paquet","b_intro":"Consultez les animaux, plantes et champignons d’une région, avec des noms en plusieurs langues, un indicateur de toxicité et les espèces avec lesquelles on les confond souvent.","b_pack":"Paquet","b_search":"Recherche","b_search_hint":"Saisissez un nom dans n’importe quelle langue ou le nom latin. Majuscules et accents n’ont pas d’importance.","b_group":"Groupe","b_all_groups":"Tous les groupes","b_toxic":"Indicateur de toxicité","b_tox_all":"Toutes les espèces","b_tox_yes":"Signalées toxiques","b_tox_no":"Non signalées toxiques","b_count":"{0} sur {1} espèces","b_none":"Aucune espèce ne correspond. Effacez la recherche ou choisissez un autre groupe.","b_more":"Afficher {0} de plus","b_back":"Retour à la liste","b_nopack":"Aucun paquet n’est chargé. Importez-en un dans « Paquets ».","b_list_l":"Espèces","k_animalia":"Animaux","k_plantae":"Plantes","k_fungi":"Champignons","g_mammal":"Mammifères","g_bird":"Oiseaux","g_reptile":"Reptiles","g_amphibian":"Amphibiens","g_fish":"Poissons","g_invertebrate":"Invertébrés","g_tree":"Arbres","g_shrub":"Arbustes","g_herb":"Herbes et fleurs","g_fungus":"Champignons","g_other":"Autres","d_group":"{0} · {1}","d_names_h":"Noms","d_tox_yes":"Signalée toxique","d_tox_no":"Non signalée toxique","d_tox_unk":"Aucun indicateur de toxicité","d_tox_warn":"« Non signalée toxique » ne veut pas dire sans danger à manger ou à toucher. Ne vous y fiez pas.","d_tox_note_h":"Note de toxicité","d_notes_h":"Notes","d_source":"Source : {0}","d_look_h":"Souvent confondue avec","d_look_help":"Certains sosies sont mortels. Cette liste les nomme ; elle n’apprend pas à les distinguer.","d_look_go":"Aller à {0}","d_photos_h":"Photos","d_photo_cap":"Photo : {0} · {1}","d_or mer un. Tout reste dans ce navigateur.","gd_3":"Utilisez « Créer » pour faire un paquet pour une classe, un club nature ou une région : ajoutez des espèces, reliez les sosies, vérifiez le paquet et téléchargez le fichier.","gd_4":"Pour partager un paquet avec tout le monde, envoyez le fichier au projet. Les contributeurs le découpent en un fichier par espèce, lancent les vérifications et l’ajoutent aux paquets intégrés.","gd_5":"Un paquet est un fichier JSON au format « vietar-pack » avec une liste d’espèces. Une espèce peut porter des photos (URI de données, avec auteur et licence) et des liens vers des enregistrements xeno-canto. Cette page ne charge rien depuis le réseau.","gd_ex_h":"Une photo et un son pour une espèce","gd_ex_note":"Les photos doivent être petites (utilisez scripts/optimize.py du dépôt) et porter auteur, licence et source. Les sons sont uniquement des liens vers xeno-canto.org.","h_limits":"Limites honnêtes","lim_1":"Les paquets intégrés sont des brouillons : noms et notes ont été rédigés avec un assistant IA à partir de connaissances générales et vérifiés en partie seulement sur des pages publiques. Aucun biologiste, mycologue ni locuteur natif ne les a relus. Les paquets bulgare et moldave sont des squelettes de 10 espèces chacun.","lim_2":"« Non signalée toxique » signifie seulement que personne n’a marqué l’espèce comme toxique dans ce paquet. Ce n’est jamais l’affirmation qu’une plante ou un champignon est comestible ou sans danger, et les paquets n’apprennent pas à distinguer les sosies. Ne mangez jamais une plante ou un champignon sauvage à cause de cette page.","lim_3":"Les paquets intégrés ne contiennent ni photos ni liens sonores, car les licences et les numéros d’enregistrement n’ont pas pu être vérifiés hors ligne. Le format accepte les deux, avec auteur, licence et source.","lim_4":"Les paquets importés ici ne sont conservés que dans ce navigateur ; effacer les données du site les supprime. Téléchargez ceux auxquels vous tenez.","li úblicas. Ningún biólogo, micólogo ni hablante nativo los ha revisado. Los paquetes de Bulgaria y Moldavia son esqueletos de 10 especies cada uno.","lim_2":"«No marcada como tóxica» solo significa que nadie marcó la especie como tóxica en este paquete. Nunca es una afirmación de que una planta o una seta sea comestible o segura, y los paquetes no enseñan a distinguir los dobles. No comas nunca una planta o una seta silvestre por esta página.","lim_3":"Los paquetes incluidos no contienen fotos ni enlaces a sonidos, porque las licencias y los números de grabación no se pudieron comprobar sin conexión. El formato admite ambos, con autor, licencia y fuente.","lim_4":"Los paquetes importados aquí se guardan solo en este navegador; borrar los datos del sitio los elimina. Descarga los que te importen.","lim_5":"La aplicación VietAR todavía no puede importar estos paquetes. Por ahora los paquetes se leen y se comprueban en esta página y con los scripts del repositorio.","lim_6":"Las traducciones de la interfaz las escribió una máquina y no las han revisado hablantes nativos. Los nombres y notas de las especies aparecen en el idioma del paquete, con el inglés como respaldo."},"pt":{"nav":"Pacotes de espécies","title":"VietAR Packs · pacotes regionais de espécies","open":"Abrir os pacotes","tabs_l":"Secções","tab_browse":"Explorar","tab_packs":"Pacotes","tab_build":"Criar","tab_guide":"Guia","s_h":"Leia isto primeiro","s_1":"Esta página lista espécies. Não identifica nada e não é um guia de campo.","s_2":"«Não marcada como tóxica» não é uma promessa de segurança: muitas plantas e cogumelos de aspeto inofensivo têm sósias mortais. Nunca coma nem toque numa planta ou num cogumelo silvestre por causa de uma aplicação, de uma foto ou desta lista.","s_3":"Os pacotes marcados «Rascunho» ou «Esqueleto» não foram revistos por um especialista. Pergunte a um especialista local antes de confiar em qualquer coisa aqui.","b_h":"Explorar um pacote","b_intro":"Consulte os animais, plantas e gações para xeno-canto.org.","h_limits":"Limites sinceros","lim_1":"Os pacotes incorporados são rascunhos: nomes e notas foram escritos com um assistente de IA a partir de conhecimentos gerais e verificados apenas em parte em páginas públicas. Nenhum biólogo, micologista ou falante nativo os reviu. Os pacotes da Bulgária e da Moldávia são esqueletos de 10 espécies cada.","lim_2":"«Não marcada como tóxica» significa apenas que ninguém marcou a espécie como tóxica neste pacote. Nunca é a afirmação de que uma planta ou um cogumelo é comestível ou seguro, e os pacotes não ensinam a distinguir os sósias. Nunca coma uma planta ou um cogumelo silvestre por causa desta página.","lim_3":"Os pacotes incorporados não contêm fotos nem ligações a sons, porque as licenças e os números das gravações não puderam ser verificados sem ligação à internet. O formato admite ambos, com autor, licença e fonte.","lim_4":"Os pacotes importados aqui ficam guardados apenas neste navegador; limpar os dados do site elimina-os. Descarregue os que lhe interessam.","lim_5":"A aplicação VietAR ainda não consegue importar estes pacotes. Por enquanto os pacotes são lidos e verificados nesta página e pelos scripts do repositório.","lim_6":"As traduções da interface foram escritas por uma máquina e não foram revistas por falantes nativos. Os nomes e as notas das espécies aparecem na língua do pacote, com o inglês como alternativa."},"de":{"nav":"Artenpakete","title":"VietAR Packs · regionale Artenpakete","open":"Pakete öffnen","tabs_l":"Bereiche","tab_browse":"Stöbern","tab_packs":"Pakete","tab_build":"Erstellen","tab_guide":"Anleitung","s_h":"Bitte zuerst lesen","s_1":"Diese Seite listet Arten auf. Sie bestimmt nichts und ist kein Bestimmungsbuch.","s_2":"«Nicht als giftig markiert» ist kein Sicherheitsversprechen: Viele harmlos aussehende Pflanzen und Pilze haben tödliche Doppelgänger. Iss oder berühre niemals eine wild wachsende Pflanze oder einen Pilz aufgrund einer App, eines Fotos oder dieser List in Paket für eine Schulklasse, einen Naturverein oder eine Region: Arten hinzufügen, Doppelgänger verknüpfen, das Paket prüfen und die Datei herunterladen.","gd_4":"Um ein Paket mit allen zu teilen, sende die Datei an das Projekt. Mitwirkende zerlegen sie in eine Datei pro Art, führen die Prüfungen aus und nehmen sie in die eingebauten Pakete auf.","gd_5":"Ein Paket ist eine JSON-Datei im Format «vietar-pack» mit einer Liste von Arten. Eine Art kann Fotos (Daten-URIs mit Autor und Lizenz) und Links zu xeno-canto-Aufnahmen tragen. Diese Seite lädt nichts aus dem Netz.","gd_ex_h":"Ein Foto und ein Laut bei einer Art","gd_ex_note":"Fotos müssen klein sein (nutze scripts/optimize.py aus dem Repository) und Autor, Lizenz und Quelle tragen. Laute sind nur Links zu xeno-canto.org.","h_limits":"Ehrliche Grenzen","lim_1":"Die eingebauten Pakete sind Entwürfe: Namen und Hinweise wurden mit einem KI-Assistenten aus allgemeinem Wissen geschrieben und nur teilweise anhand öffentlicher Seiten geprüft. Keine Biologin, kein Pilzkundler und keine Muttersprachlerin hat sie durchgesehen. Die Pakete für Bulgarien und Moldau sind Gerüste mit je 10 Arten.","lim_2":"«Nicht als giftig markiert» heißt nur, dass niemand die Art in diesem Paket als giftig markiert hat. Es ist nie die Aussage, dass eine Pflanze oder ein Pilz essbar oder sicher ist, und die Pakete lehren nicht, Doppelgänger zu unterscheiden. Iss niemals eine wild wachsende Pflanze oder einen Pilz aufgrund dieser Seite.","lim_3":"Die eingebauten Pakete enthalten keine Fotos und keine Laut-Links, weil Lizenzen und Aufnahmenummern offline nicht überprüft werden konnten. Das Format unterstützt beides, mit Autor, Lizenz und Quelle.","lim_4":"Hier importierte Pakete werden nur in diesem Browser gespeichert; das Löschen der Websitedaten entfernt sie. Lade die herunter, die dir wichtig sind.","lim_5":"Die VietAR-App kann diese Pakete noch nicht importieren. Vorerst werden die Pakete auf dieser Seite und von den Skripten im Repository gelesen und geprüft.","lim_6":"Die Übersetzungen der Oberfläche wurden von einer Maschine geschrieben und nicht von Muttersprachlern geprüft. Namen und Hinweise zu den Arten erscheinen in der Sprache des Pakets, mit Englisch als Ersatz."},"hu":{"nav":"Fajcsomagok","title":"VietAR Packs · regionális fajcsomagok","open":"Csomagok megnyitása","tabs_l":"Részek","tab_browse":"Böngészés","tab_packs":"Csomagok","tab_build":"Készítés","tab_guide":"Útmutató","s_h":"Ezt olvasd el először","s_1":"Ez az oldal fajokat sorol fel. Semmit nem határoz meg, és nem határozókönyv.","s_2":"A «Nincs mérgezőnek jelölve» nem biztonsági ígéret: sok ártalmatlannak látszó növénynek és gombának halálos hasonmása van. Soha ne egyél és ne érints meg vadon élő növényt vagy gombát egy alkalmazás, egy fénykép vagy ez a lista alapján.","s_3":"A «Vázlat» vagy «Váz» jelzésű csomagokat nem nézte át szakértő. Kérdezz meg egy helyi szakértőt, mielőtt bármire támaszkodsz itt.","b_h":"Csomag böngészése","b_intro":"Nézd meg egy régió állatait, növényeit és gombáit többnyelvű nevekkel, mérgezőségi jelzéssel és azokkal a fajokkal, amelyekkel gyakran összetévesztik őket.","b_pack":"Csomag","b_search":"Keresés","b_search_hint":"Írj be egy nevet bármely nyelven, vagy a latin nevet. A kis- és nagybetű és az ékezetek nem számítanak.","b_group":"Csoport","b_all_groups":"Minden csoport","b_toxic":"Mérgezőségi jelzés","b_tox_all":"Minden faj","b_tox_yes":"Mérgezőnek jelölt","b_tox_no":"Nincs mérgezőnek jelölve","b_count":"{0} / {1} faj","b_none":"Egy faj sem felel meg. Töröld a keresést vagy válassz másik csoportot.","b_more":"Még {0} megjelenítése","b_back":"Vissza a listához","b_nopack":"Nincs betöltött csomag. Importálj egyet a «Csomagok» részben.","b_list_l":"Fajok","k_animalia":"Állatok","k_plantae":"Növények","k_fungi":"Gombák","g_mammal":"Emlősök","g_bird":"Madarak","g_reptile":"Hüllők","g_amphibian":"Kétéltűek","g_fish":"Halak","g_invertebrate":"Gerinctelenek","g_tree":"Fák","g_shrub":"Cserjék","g_herb":"Füvek const SHAPE_CODES = ['type', 'missing', 'extra', 'length', 'pattern', 'enum'];

var SCHEMAS = { species: null, pack: null };

function hasOwn(o, k) { return Object.prototype.hasOwnProperty.call(o, k); }

/* ---------- evaluator de schemă (submulțimea de cuvinte-cheie folosită de schema.json și pack.schema.json) ---------- */
function walk(root, node, v, path, out) {

  if (at < 0 && S.packs.length >= LIMITS.packs) return { err: 'i_err_full', arg: LIMITS.packs };
